# Smoke-test every service folder: shell syntax + compose validation.
# No containers are started; example env files stand in for real ones.
name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (all scripts)
        run: |
          fail=0
          for f in */run.sh */update.sh */stop.sh */restart.sh plane/setup.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || fail=1
          done
          exit $fail

      - name: Compose config check (each stack)
        run: |
          fail=0
          for d in umami beszel glance sure caddy checkmk uptime-kuma checkmate; do
            if [ -f "$d/compose.yml" ]; then
              created=""
              if [ ! -f "$d/.env" ]; then
                cp "$d/.env.example" "$d/.env"
                created=1
              fi
              (cd "$d" && docker compose config -q) || { echo "FAIL: $d"; fail=1; }
              [ -n "$created" ] && rm -f "$d/.env"
            fi
          done
          exit $fail

      - name: Caddyfile validation
        run: |
          cd caddy
          created=""
          for f in basic-auth.caddy tailscale-ips.caddy; do
            if [ ! -f "$f" ]; then
              cp "$f.example" "$f"
              created="$created $f"
            fi
          done
          docker run --rm \
            -v ./Caddyfile:/etc/caddy/Caddyfile:ro \
            -v ./basic-auth.caddy:/etc/caddy/basic-auth.caddy:ro \
            -v ./tailscale-ips.caddy:/etc/caddy/tailscale-ips.caddy:ro \
            caddy:latest \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          for f in $created; do rm -f "$f"; done
