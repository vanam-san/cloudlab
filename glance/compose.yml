# Glance - self-hosted dashboard
# Image: glanceapp/glance:latest
# Docs: https://github.com/glanceapp/glance
#
# Setup notes (follows the upstream "Docker compose manual" method):
# - Config lives in ./config/glance.yml (bind-mounted read-only) and IS
#   committed to git — customizing the dashboard is the point of Glance.
#   After editing it, restart the service: `docker compose restart glance`.
# - No container healthcheck: the image is a minimal single binary with no
#   shell/probe tools and no status endpoint; ./run.sh polls `/` over HTTP
#   until it returns 200 instead.
# - The app port is bound to 127.0.0.1 only. In production the service
#   gets a domain via the Caddy reverse proxy (see ../caddy) and is
#   never exposed directly to the network.
services:
  glance:
    image: ${GLANCE_IMAGE:-glanceapp/glance:latest}
    container_name: glance
    restart: unless-stopped
    ports:
      # Localhost-only; public access goes through Caddy in production.
      - "127.0.0.1:${GLANCE_PORT:-8080}:8080"
    volumes:
      # Read-only: Glance only reads its config, never writes to it.
      - ./config:/app/config:ro
      # Custom CSS / assets (./assets/user.css template file).
      - ./assets:/app/assets:ro
      # Correct timestamps in logs/widgets.
      - /etc/localtime:/etc/localtime:ro
    # Makes .env variables (e.g. MY_SECRET_TOKEN) available for use
    # inside the dashboard YAML files as ${...}.
    env_file: .env
    # Lets the server-side `monitor` widget reach sibling compose projects
    # on their localhost ports via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"