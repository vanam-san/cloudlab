# Caddy - automatic HTTPS reverse proxy
# Image: caddy:latest
# Docs: https://caddyserver.com/docs/
#
# Role: Caddy binds directly to host ports 80/443 via network_mode: host
# so it sees real client IPs (required for the optional tailscale-only
# remote_ip matcher — Docker port mapping hides the source IP behind the
# bridge). Sites are gated by HTTP Basic Auth by default (basic-auth.caddy).
# All backend apps (umami, beszel, sure, glance, plane, checkmk,
# uptime-kuma, checkmate) expose localhost-only port bindings; Caddy
# reaches them via reverse_proxy localhost:<port>.
#
# Setup notes:
# - Healthcheck queries the admin API (127.0.0.1:2019/config) instead of
#   port 80: with no sites configured Caddy answers 404 on :80, while the
#   admin endpoint always returns 200 while Caddy is running.

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:latest}
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      # Mount the whole caddy directory so single-file edits (e.g. adding a
      # Basic Auth user) are always visible inside the container. Binding
      # individual files tracks their inode: replacing the file (editor save,
      # git checkout, cp-over) leaves the container serving a deleted inode,
      # so reloads pick up stale credentials and appear to hang/time out.
      - ./:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy-data:
  caddy-config: